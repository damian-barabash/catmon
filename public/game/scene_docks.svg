      <stop offset="1" stop-color="#0A1526"/>
    </linearGradient>
    <radialGradient id="dmoon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EAF4FF" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#9FC6FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#9FC6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cred" x1="0" y1="0" x2="0" y2="1">
