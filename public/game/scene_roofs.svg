      <stop offset="1" stop-color="#121026"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#FFD558" stop-opacity="0.3"/>
