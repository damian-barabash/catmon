<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Золотой сундук: гравировка, самоцветы, сияние -->
  <g stroke="#4A3200" stroke-width="1.6" stroke-linejoin="round">
    <!-- крышка-арка -->
    <path d="M6 21c0-8 8-13 18-13s18 5 18 13v2H6Z" fill="#F2B01F"/>
    <path d="M6 21c0-8 8-13 18-13-4 3-6 7.5-6 13v2H6Z" fill="#D89400" stroke="none"/>
    <!-- гравировка-завитки на крышке -->
    <path d="M12 16c2-3 4.5-4.6 7-5M36 16c-2-3-4.5-4.6-7-5" fill="none" stroke="#FFE08A" stroke-width="1.3" stroke-linecap="round"/>
    <!-- корпус -->
    <path d="M7 23h34v15a4 4 0 0 1-4 4H11a4 4 0 0 1-4-4Z" fill="#E8A200"/>
    <path d="M7 23h10v19h-6a4 4 0 0 1-4-4Z" fill="#D08E00" stroke="none"/>
    <!-- фигурные уголки -->
    <path d="M7 23v6c3 0 5-1.4 5-3.6V23Zm34 0v6c-3 0-5-1.4-5-3.6V23Z" fill="#FFD558"/>
    <path d="M7 42h6c0-3-2.4-4.6-6-4.6Zm34 0h-6c0-3 2.4-4.6 6-4.6Z" fill="#FFD558"/>
    <!-- кромка стыка -->
    <path d="M6 21.4h36v3.2H6Z" fill="#B37F00"/>
    <!-- самоцветы на корпусе -->
    <path d="M14.4 31l2.2 2.4-2.2 3.6-2.2-3.6Z" fill="#2F6BFF"/>
    <path d="M33.6 31l2.2 2.4-2.2 3.6-2.2-3.6Z" fill="#9333EA"/>
    <!-- замок с большим рубином -->
    <path d="M20 18.5h8a2 2 0 0 1 2 2v7.6a6 6 0 0 1-12 0v-7.6a2 2 0 0 1 2-2Z" fill="#FFD558"/>
    <path d="M24 21.6l3.4 3-3.4 5.2-3.4-5.2Z" fill="#D6323C"/>
    <path d="M22.4 23.4l1.6-1.2" stroke="#FF8A8A" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <!-- сияние -->
  <g fill="#FFF3C4">
    <path d="M42.5 6l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9Z"/>
    <path d="M5.5 12l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7Z"/>
    <path d="M40 44l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6Z"/>
  </g>
</svg>
